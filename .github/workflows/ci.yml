name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:toolkit
      - run: npm run lint:text
      - run: npm run typecheck:cloud
      - run: npm run test:cloud
      - run: npm run test:release
      - run: npm run build:pages
      - name: Browser E2E (headless Chrome)
        run: |
          command -v google-chrome || command -v chromium || exit 1
          npm run test:e2e
      - run: npm run build:cloud
